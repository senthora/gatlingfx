name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master, dev ]
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "core/**"
      - "proxy/**"
      - "runtime/**"
      - "wiremock/**"
      - '!**/*.md'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/dev' }}
          cache-cleanup: never

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build Java modules
        run: ./gradlew build -x test -x integrationTest

      - name: Run unit tests
        run: ./gradlew test

      - name: Build docker images
        run: just compose build

      - name: Start compose services
        run: just compose up -d

      - name: Run integration tests
        run: ./gradlew integrationTest -x test

      - name: Print compose logs
        if: always()
        run: just compose logs --tail=500 --no-color || true

      - name: Stop compose services
        if: always()
        run: docker compose down
