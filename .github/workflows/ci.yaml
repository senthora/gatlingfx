name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master, dev ]
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "core/**"
      - "proxy/**"
      - "runtime/**"
      - "wiremock/**"
      - '!**/*.md'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Build Java modules
        run: ./gradlew build -x test -x integrationTest

      - name: Run unit tests
        run: ./gradlew test

      - name: Build docker images
        run: just compose build

      - name: Start compose services
        run: just compose up -d

      - name: Run integration tests
        run: ./gradlew integrationTest -x test

      - name: Generate coverage report
        run: ./gradlew jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/jacocoRootReport.xml
          disable_search: true
          fail_ci_if_error: true

      - name: Print compose logs
        if: always()
        run: just compose logs --tail=500 --no-color || true

      - name: Upload GatlingFx logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gatlingfx-logs-${{ github.run_number }}
          path: build/gatlingfx
          if-no-files-found: warn
          retention-days: 14

      - name: Stop compose services
        if: always()
        run: docker compose down

  publish-snapshot:
    name: Publish Snapshot
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          cache-cleanup: never

      - name: Publish snapshots
        run: ./gradlew publishToMavenSnapshots
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
