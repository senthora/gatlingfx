absolute_redirect off;

map $http_x_tea_strength $tea_order_code {
    ""          0;
    "volcanic"  2;
    default     1;
}

server {
    listen 80;
    server_name _;

    location = /order/coffee {
        return 418;
    }

    location = /order/tea {
        default_type application/json;

        if ($tea_order_code = 1) {
            return 400 '{"error":"weak tea is forbidden"}';
        }
        return 201 '{"drink":"tea","temperature":"volcanic","leaves":"probably"}';
    }

    # Tea shop only serves volcanic tea
    location = /order/decaf-tea {
        return 302 /order/tea;
    }

    location / {
        return 404;
    }
}
